# how it was produced.
automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >
        Interactive agent sessions directed by the author, with the conventions of the author's
        Lean projects (Mathlib's style and naming, short proofs) enforced: a per-commit
        verification chain (a build without warnings with Mathlib's standard linters, a project
        style lint, a layout check of the imports and of the restrictions on the model, the
        correspondence check against the C code at the pinned commit, the blueprint's
        declaration check, and a diff of the types of all declarations), with sub-agents for
        research, for drafts of the Lean code of each item of a stage (written in a separate copy
        and transplanted into the repository after review, through the verification chain), and
        for the review of the C ranges and of the code; at the end of each stage the project is
        also built with other values of the compile-time constants of the C code, to check that no
        proof depends on them. The statements of comparator/challenges.json are certified with
        Lake's lake comparator --paranoid (Lean v4.35.0 and later), which builds and exports the
        project in a sandbox and checks the export with Lean's kernel and the five external
        checkers bundled with Lean.
      cost:
        wall_time: ""
        spend_usd: "subscription-based usage"
        hardware: "API-only"
      prompting_notes: >
        The design was fixed by the author on 2026-10-08, after two rounds of independent review,
        on the basis of an analysis of the whole C library (its components one by one, the
        specification, the history of the bugs, a survey of the Lean tooling, prototypes). Each
        stage begins with a blueprint chapter (components, contracts, proposed names) that the
        author reviews before any Lean code of the stage is written.
  spend_usd: "subscription-based usage (no metered API spend)"
  notes: >
    The C defects found while this project was planned were fixed first, in ratpoints 3.1.1, so
    that the specification describes the fixed behaviour.

# fidelity
fidelity:
  divergences: >
    By design: a C long is an Int or a Nat, with the obligation that its value lies in the range of
    the C type, or, in the test for common factors and in the bits of an interval of numerators, a
    64-bit word, as in the C code; the reductions by a reciprocal compute on 64-bit words, with the
    high half of the 128-bit product, for which Lean core has no type, from the 32-bit halves; a
    pointer is an index; the SIMD operations are the word operations they implement, and the arm of
    the first stage that the build compiles is chosen by a test on the constant of the chunk; the
    threads are replaced by the sequential order of the blocks; the heuristics that choose the
    sieving parameters by the curve are not modelled yet (stage I), since the theorems quantify over
    every well-formed choice; the parameters of the command line follow the counting rules of
    ratpoints where these do not depend on the curve; the search intervals have exact rational ends;
    the callback is a Lean function that takes the coordinates and the caller's data and returns its
    value, whether it stops the search, and the new data, for the C function with the pointers info
    and quit; and until the blocks of stage I the model lists the denominators of a shape before it
    sieves the first one, all of them, also those after a stop.
    Where the library function find_points and the command-line program differ (the order of the
    checks on the input), the model follows the program. Each deviation is recorded with its
    component in the correspondence record.

# review status
review:
  status: "unchecked"
  reviewers: []
  notes: >
    No review by others yet; the main theorems are certified by comparator (status.main_results).
    Each stage chapter of the blueprint is reviewed by the author before its Lean code is
    written.

# alignment - how source statements map to formal declarations.
alignment:
  namespace: "Ratpoints"
  statements:
    - source: "the points the program prints: the normalized solutions of y^2 = F(x, z) of height at most H"
      lean: "Ratpoints.IsPoint"
      module: "Ratpoints.Spec.Basic"
      status: "formalized"
      note: >
        the specification (Ratpoints.binaryForm, Ratpoints.IsPoint, Ratpoints.points); the
        brute-force reference Ratpoints.bruteForce lists exactly these points, each once
        (Ratpoints.mem_bruteForce_iff, Ratpoints.nodup_bruteForce), certified by comparator
    - source: "find_points returns each such point exactly once"
      lean: "Ratpoints.mem_iff_isPoint_of_findPoints_eq_ok"
      module: "Ratpoints.Proof.Output"
      status: "partially-formalized"
      note: >
        for the sieve on the bit arrays of words of stage C2 with the set-up of stage D (the
        refusals, the reversal, the exit), the side of the denominators of stage E (the 2-adic
        information, the tests on the denominators, the loop over them in its four shapes), the
        tables and the moduli of stage F1 (the table of a prime as the C code builds it, the loop of
        the tables, prime powers and products of them as moduli), the stages of the sieve and the
        check of stage F2 (the second and the third stage, the test for common factors on the longs
        of the C code, the reductions by a reciprocal, the cut points of the stages), the packing of
        the numerators of stage F3 (the classes with their strides, the rows of offsets, the
        residues of a denominator divided by its stride, the bits of the heights, the row indices of
        the first two stages with the test small) and the chunked first stage and the rows of stage
        F4 (both arms of the first stage with the chunk of the default build, the rows built by the
        builders of the C code and kept in the tables of rows of its entries), every well-formed
