# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# See https://github.com/mathlib-initiative/formalization.yaml

version: "v0.4"

# project - the formalization itself (not the source).
project:
  name: "RatpointsLean: a verified model of ratpoints"
  description: >
    A Lean 4 model of ratpoints, the C program that finds the rational points of bounded height on
    the curves y^2 = F(x, z), F a binary form of even degree with integer coefficients, by sieving.
    The model mirrors the hardware-independent structure of the C code function by function (the
    same loops, tables, bit arrays of 64-bit words and index arithmetic); the proofs are to show
    that, for every well-formed choice of the sieving parameters, it returns exactly the normalized
    points of height at most H, without duplicates, in the order of the C program, delivered to the
    callback of the caller as the C code delivers them, and refuses exactly the inputs that the C
    program refuses in a default run (fewer than two or more than maxDegree + 1 = 101
    coefficients, H = 0 or H >= 2^63, a height that is not a C long, and a binary form that is not
    squarefree); a correspondence record and differential tests link the model to the C code.
  authors: ["Michael Stoll"]
  responsible_maintainers: ["Michael Stoll"]
  license: "Apache-2.0"

# sources - what was formalized.
sources:
  - title: "ratpoints: a program to find rational points on hyperelliptic curves, release 3.1.1"
    authors: ["Michael Stoll"]
    id: "https://github.com/MichaelStollBayreuth/ratpoints, tag v3.1.1 (commit 1a998538dfa835bb1bce6047e75302cc01517443)"
    type: "software"
    location: >
      the library (find_points.c, sift.c, init.c, sturm.c, rp-private.h, ratpoints.h, primes.h,
      and the generators gen_find_points_h.c and gen_init_sieve_h.c) and the parts of main.c that
      the command-line program mirrors
    relationship: "formalizes"
    note: >
      The C code is modelled, not translated (Lean has no semantics of C): every model
      declaration names the lines of C it models, at the pinned commit, and
      scripts/correspondence.py checks the record (correspondence/README.md).
    license: "GPL-2.0-or-later"
    author_endorsement: "participated"
  - title: "ratpoints-3.1 (the manual of the program)"
    authors: ["Michael Stoll"]
    id: "ratpoints-doc-3.1.tex in the repository above, at the same commit"
    type: "manual"
    location: "the description of the library function find_points and of the command line"
    relationship: "formalizes"
    note: "The specification of the Lean development is the behaviour the manual and the code define."
    license: "GPL-2.0-or-later"
    author_endorsement: "participated"

related_formalizations: []

classification:
  arxiv: ["math.NT", "cs.LO"]
  msc2020: ["11G30", "14G05", "11Y50", "68V20"]

# project status
status:
  scope: >
    Stages A, B, C1, C2, D, E, F, in its four sub-stages F1 to F4, and G. Stage A set up the
    Lake project with the libraries of the model (Lean core and Std only), the specification and the
    proofs, the CI, the blueprint, the correspondence record with its checking script, and the
    comparator harness, and settled the specification in the blueprint. Stage B: the specification
    in Lean (the binary form, the normalized points of height at most H, the finite set of them, and
    the binary form over Q that the refusals speak about), the brute-force reference in the model
    with the theorems that it lists exactly these points, each once, certified by comparator, the
    command-line program ratpoints-lean, which reads its command line as the C program does, with
    its checks, messages and exit statuses, and the differential tests that compare it with the C
    program (the test suites of ratpoints, hand-written and random command lines). Stage C1: the
    plain sieve in the skeleton of the C code (the compile-time constants of the C code as
    definitions, the sieving parameters with their well-formedness, the tables of a prime and their
    rows, the sieve of one denominator, its survivors, the denominators, the points at infinity),
    the contracts of its loops proved with the program logic of Lean core, and the theorem that for
    every well-formed choice of the parameters it returns the list of the brute-force reference; the
    main theorems (the membership and no-duplicates theorems for findPoints, its refusals in the
    form of stage C1, and the well-formedness of the parameters that the options of the program
    give) are certified by comparator; ratpoints-lean runs the sieve with the parameters of its
    options, and the differential tests have a suite of parameters. Stage C2: the sieve on the bit
    arrays of 64-bit words of the C code (the width of the bit arrays as a constant of the build and
    the array size of the pieces as a parameter, the operations on bit arrays and the lowest set bit
    as in the C code, the rows of a denominator as words, each made when first needed, the first
    stage over a piece, the check of a numerator, the walk through the set bits of a word, the scan
    up to a sentinel, one piece with the masks at its ends, one denominator in pieces, and the run),
    with the contracts of its loops proved with the program logic of Lean core for every width of
    the bit arrays, and the plain sieve of stage C1 kept as its reference; findPoints and
    ratpoints-lean run it, and the main theorems keep their statements; the differential tests
    search up to height 30000, and the runs of test4.sh above that height, up to 100000, form a
    suite run locally. Stage D: the set-up of the search as the C code does it before the sieve,
    with the options of the library that change the refusals and the order of the output (whether
    the polynomial may be reversed, and the depth of the Sturm step, of which the set-up reads only
    the sign): the refusal of a binary form that is not squarefree when the leading zeros lower the
    even degree, in the reversal check and by the remainder chain of the Sturm step, computed row by
    row as the C code computes it, with its contract and the proof that it detects exactly a
    repeated factor; the reversal check in its three cases, the reflection of the polynomial that
    exchanges x and z in the binary form, and the map of the points of a reversed search, a
    bijection of the points of bounded height that the check of a survivor and the points at
    infinity apply; the coefficients as C longs with the helper mod of the C code and its range
    obligations; the table of a prime with the exit when the curve has no points modulo that prime;
    and the search of the polynomial handed on. The output of findPoints is a permutation of the
    brute-force reference, so that the membership and no-duplicates theorems hold for every option;
    the refusal theorems say that with the Sturm step on findPoints refuses exactly the inputs with
    fewer than two or more than maxDegree + 1 coefficients, H = 0 (since stage F2 also H >= 2^63)
    and a binary form that is not squarefree, and with it off exactly what the C program refuses
    under -s; both refusal theorems and the main theorems with the options argument are stated for
    comparator, with the binary form over Q restated in the challenge; the lemmas on homogenizations
    and their squarefreeness are candidates for Mathlib; ratpoints-lean reads the options -k, -K, -s
    and -S and refuses a form that is not squarefree with error 8 as the C program does with the
    same options; and the differential tests compare the refusals and these options. Stage E: the
    side of the denominators as the C code has it, with the compile-time constants of this part of
    the C code as definitions: the valuation; the 2-adic information with the classes of the
    denominators modulo 64, the word of the class as the starting value of the first stage of the
    sieve, and the exit when no class admits a numerator; for odd degree the squares and the
    divisors of the leading coefficient times squares (the factorization over the table of primes,
    the squarefree divisors and the slopes of the valuation test); for even degree the forbidden
    divisors, tested with words of 64 denominators and by their valuations (the Newton polygon at a
    prime), and the Jacobi test, by the binary algorithm and by tables, both proved to compute the
    Jacobi symbol of Mathlib; and the four shapes of the loop over the denominators with their lists
    and tests, the run over a shape and its reduction to the reference; the contracts of the stage
    are proved with the program logic of Lean core in files with Mathlib, and the lemmas of
    Mathlib's generality are candidates for Mathlib. The output of findPoints is the list of the
    points at infinity followed by the points of the brute-force reference of the polynomial
    searched over the denominators in the order of the loop of its search, each mapped back after a
    reversal: a permutation of the reference, and the reference itself when the options forbid the
    reversal and the search does not take the divisors times squares; the main theorems, the refusal
    theorems and the statements for comparator keep their statements; ratpoints-lean prints the
    points in the order of the C program, and the differential tests compare every point list in its
    order (3219 comparisons in the default suites). Stage F1: the tables and the moduli as the C
    code has them: the table of a prime as examine_prime computes it, a component with its contract,
    by Horner's rule with the Barrett reduction on the fixed schedule of the C code, exact for the
    primes below 2^maxBitsInPrime, with the range obligation of its accumulator, handing back the
    coefficients modulo the prime and its entry at infinity; the loop of the tables of sieving_info
    with the exit and the forbidden divisors prime by prime, and the second loop of the forbidden
    divisors from the number of primes examined; prime powers as moduli, with the tables of
    examine_power and the inverses by the extended Euclidean algorithm, and products of prime
    powers, with the factors of a modulus over the table as add_moduli finds them and the sieve
    entry of a modulus of any kind, sound without the Chinese remainder theorem, and the range
    obligations of the longs of these computations; the parameters gain the number of primes
    examined, and their well-formedness, which the statements for comparator import from the model,
    admits the composite moduli below 2^maxBitsInPrime that factor over the first numPrimes primes
    of the table, and no longer the primes of the table from 2^maxBitsInPrime on; the output, the
    main theorems, the refusal theorems and the statements for comparator keep their text, and the
    differential tests agree as before (3219 comparisons in the default suites). Stage F2: the
    stages of the sieve and the check as the C code has them: the first stage with the first moduli
    of the parameters, the second stage on each bit array that the first leaves nonzero, in both
    arms of the build (the whole bit array, or one word at a time), and the test of a candidate, the
    test for common factors by the binary algorithm of relprime on the 64-bit longs of the C code,
    with the mask of the arithmetic shift and the trailing zeros of a word, followed by the third
    stage, one numerator at a time against the tables of its primes; the reductions by a
    multiplication with the reciprocal of a modulus (RP_MULMOD and RP_MULDIV), exact for u p < 2^64,
    the reciprocal a field of the sieve entries and of the tables of the Jacobi test, which reduces
    with it too; the table of the third stage and the products of the check made once per
    denominator, when its first numerator needs them; the contracts of these components proved with
    the program logic of Lean core, with the range obligations of their longs; the staged sieve
    gives the numerators of the sieve with all the moduli in the first stage, in the same order, for
    prime entries in the third stage, which the well-formedness of the parameters gives. findPoints
    refuses a height bound of 2^63 or more, which is not a C long, with error 4, as the program does
    when it reads one, so that the refusal theorems refuse H = 0 or H >= 2^63; the membership and
    no-duplicates theorems keep their statements; the parameters of the command line take the cut
    points of the stages by the counting rules of ratpoints where these do not depend on the curve,
    so that a run without options uses all three stages (11, 11 and 8 of the first 30 primes), and
    the well-formedness theorem of these parameters keeps its text; the differential tests compare
    every point list in its order (3315 comparisons in the default suites, among them option sets
    that run the second and the third stage after few moduli in the first, and 13 in the suite run
    locally). Stage F3: the packing of the numerators as the C code has it: the classes of the
    denominators modulo 64, whose admitted numerators lie in one residue class a0 modulo a stride
    2^k, with the pattern of each class packed to its stride, so that bit t of the sieve of a
    denominator stands for the numerator a0 + 2^k t; the rows of offsets that the packings share,
    with the inverses of the strides, and the fields bias, rbainv and dinv of the sieve entries set
    as the C code sets them; the residues of a denominator divided by its stride in the three
    branches of fill_bp_list; the bits of the heights on 64-bit signed words in both forms of
    numerators_to_bits; the row indices of the first two stages with the offsets, reduced by mod_mul
    with the reciprocal of the modulus where the word numbers of a piece allow it (the test small)
    and by a division otherwise, the reciprocals stepped with the moduli; the stride in the
    extraction; and the reductions by a reciprocal on 64-bit words, the high half of the 128-bit
    product from the products of the 32-bit halves; the contracts proved with the program logic of
    Lean core in files without Mathlib, with the range obligations of the longs; a row is unchanged
    when the residue and the numerator are multiplied by the same unit, given tables of inverses
    that invert, so the packed sieve keeps exactly the numerators that the unpacked one keeps, in
    the same order, and the output, the main theorems, the refusal theorems, the statements for
    comparator, the parameters and their well-formedness do not change; the differential tests agree
    as before (3315 comparisons in the default suites and 13 in the suite run locally). Stage F4:
    the first stage as the default build of the C code compiles it, with the chunk RATPOINTS_CHUNK =
    16 as a constant of the build: the chunked arm, which takes a chunk of bit arrays at a time in
    registers, and-s the rows of the moduli into them from starts that it steps through each row and
    does the tail of a piece in legs of 8, 4, 2 and 1 bit arrays, and the arm one row at a time for
    the other chunks, chosen as the conditional compilation of the C code chooses them, with the
    array size rounded up to a multiple of the chunk; the rows as ratpoints builds and keeps them,
    each of m + chunk - 1 bit arrays for the modulus m, the last ones copies of the first: the row
    of 0 of a prime the pattern sieves0 that the build generates, the other rows of a prime from the
    functions that the build generates from CODE_INIT_SIEVE1 and CODE_INIT_SIEVE2, those of a prime
    power from lay_out_pattern and those of a product from the rows of its factors, each builder
    storing its row in the table of rows of its entry, the entries reached as the C code reaches
    them; the tables of rows made with the entries, the missing rows of a denominator built before
    it by the loop of sift, and the tables of rows handed on through the run as state; the tables of
    a prime power as bit arrays of words, as examine_power fills them, and the words of the
    forbidden divisors among the first numPrimes primes of the table read from sieves0; the
    contracts proved with the program logic of Lean core for every value of the chunk, those of the
    first stage and of the builders in files without Mathlib: the arms leave the same words, the
    rows that the builders build are the closed forms of the admission tests, and the store of the
    tables of rows fits the entries of the run, so the output, the main theorems, the refusal
    theorems, the statements for comparator, the parameters and their well-formedness do not change;
    the differential tests agree as before (3315 comparisons in the default suites and 13 in the
    suite run locally). Stage G: the delivery of the points to the callback of the caller as the C
    code has it: the callback with the caller's data, the value that each call returns, added to the
    count, and the stop that it may request, threaded with a delivery (the data, the count and the
    flag of the stop) through the components that the C code passes process and info through, the
    flag tested where the C code tests quit, in the exact check and at infinity between the calls
    with +y and -y, in the walk after each check, after each bit array, piece and denominator, and
    after the points at infinity, where the search returns before it sieves; the points at infinity
    delivered call by call as the C code delivers them; the sieving split off the search, and each
    arm of the extraction a function of its own; the search with a callback findPointsWith, with
    findPoints its instance with the callback that appends each point to an array, so that it
    returns the list of before when neither option of the output is set; the options of the output
    RATPOINTS_NO_CHECK and RATPOINTS_NO_Y as fields of the options, copied into the flags of the
    check; and the bits of the flags that the program reads after the search written back. The
    contracts on the delivery, proved with the program logic of Lean core in the files of the
    contracts they replace, give the protocol: for well-formed parameters, the search with any
    callback gives the data and the count of the reference of the delivery, a fold over the list of
    findPoints up to the first call that stops the search, and refuses exactly what findPoints
    refuses. The specification gains a file with the order in which ratpoints finds the points (the
    points at infinity of the polynomial searched, then its denominators in the order of the loop of
    the search, ascending but for the divisors of the leading coefficient in the order of binary
    counting over its primes, the numerators ascending, +y before -y, mapped back after a reversal),
    and the order theorem says that findPoints returns that list, filtered by RATPOINTS_NO_Y, when
    RATPOINTS_NO_CHECK is clear; under RATPOINTS_NO_CHECK it returns the triples (x, 0, z) of
    normalized pairs of height at most H that survive the sieve, each once, among them those of all
    the points. The statements for comparator are twelve: membership with RATPOINTS_NO_CHECK clear
    and y >= 0 under RATPOINTS_NO_Y, no duplicates for every option, the two theorems of the
    brute-force reference, both refusal theorems and the well-formedness of the parameters of the
    program, and, new, the order theorem over the file of the order, restated verbatim, three
    statements under RATPOINTS_NO_CHECK and the protocol; comparator accepted all twelve on
    2026-10-17. ratpoints-lean runs the search with a callback, with the callback of main.c, and
    reads the options of the output of main.c (-x -X -y -Y -z -Z -1 -i -I and the formats and
    strings of -f -fs -fm -fe), with the report that main.c prints without -q but for the messages
    on the search region, the search intervals and the moduli used; a theorem says what it prints,
    in particular that -1 prints the first point of the list that -i keeps; and the differential
    tests compare the reports exactly, with the banner exchanged, -x exactly against the C program
    with the moduli pinned, and the searches that a stop ends at the height 10^12 (3784 comparisons
    in the default suites and 13 in the suite run locally). Next: the later stages that the
    introduction of the blueprint lists (the search region and the Sturm step, the blocks of the
    loop over the denominators with the threads and the correction of the moduli, and the choice of
    the sieving parameters by the curve).
