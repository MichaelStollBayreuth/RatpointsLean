# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# See https://github.com/mathlib-initiative/formalization.yaml

version: "v0.4"

# project - the formalization itself (not the source).
project:
  name: "RatpointsLean: a verified model of ratpoints"
  description: >
    A Lean 4 model of ratpoints, the C program that finds the rational points of bounded height on
    the curves y^2 = F(x, z), F a binary form of even degree with integer coefficients, by sieving.
    The model mirrors the hardware-independent structure of the C code function by function (the
    same loops, tables, bit arrays of 64-bit words and index arithmetic); the proofs show that, for
    every value of the options of the sieve, whatever moduli the search chooses, it returns exactly
    the normalized points of height at most H in the search region that the caller gives (assuming
    Sturm's theorem when the Sturm step is on), without duplicates, in the order of the C program,
    delivered to the callback of the caller as the C code delivers them, and refuses exactly the
    inputs that the C program refuses (in a default run fewer than two or more than maxDegree + 1 =
    101 coefficients, H = 0 or H >= 2^63, a height that is not a C long, and a binary form that is
    not squarefree, and search intervals that are not well formed); a correspondence record and
    differential tests link the model to the C code.
  authors: ["Michael Stoll"]
  responsible_maintainers: ["Michael Stoll"]
  license: "Apache-2.0"

# sources - what was formalized.
sources:
  - title: "ratpoints: a program to find rational points on hyperelliptic curves, release 3.1.1"
    authors: ["Michael Stoll"]
    id: "https://github.com/MichaelStollBayreuth/ratpoints, tag v3.1.1 (commit 1a998538dfa835bb1bce6047e75302cc01517443)"
    type: "software"
    location: >
      the library (find_points.c, sift.c, init.c, sturm.c, rp-private.h, ratpoints.h, primes.h,
      and the generators gen_find_points_h.c and gen_init_sieve_h.c) and the parts of main.c that
      the command-line program mirrors
    relationship: "formalizes"
    note: >
      The C code is modelled, not translated (Lean has no semantics of C): every model
      declaration names the lines of C it models, at the pinned commit, and
      scripts/correspondence.py checks the record (correspondence/README.md).
    license: "GPL-2.0-or-later"
    author_endorsement: "participated"
  - title: "ratpoints-3.1 (the manual of the program)"
    authors: ["Michael Stoll"]
    id: "ratpoints-doc-3.1.tex in the repository above, at the same commit"
    type: "manual"
    location: "the description of the library function find_points and of the command line"
    relationship: "formalizes"
    note: "The specification of the Lean development is the behaviour the manual and the code define."
    license: "GPL-2.0-or-later"
    author_endorsement: "participated"

related_formalizations: []

classification:
  arxiv: ["math.NT", "cs.LO"]
  msc2020: ["11G30", "14G05", "11Y50", "68V20"]

# project status
status:
  scope: >
    The whole of the C library of ratpoints 3.1.1 and of its command-line program, but for the
    threads, the management of memory, the calling conventions of the library, the instrumentation
    for development and debugging, and a few lines without a counterpart in Lean (the includes,
    macros that the C code does not use, the arm of a build without a 128-bit integer type). The
    specification: the binary form of even degree of a coefficient list, the normalized points of
    height at most H on y^2 = F(x, z), the finite set of them, and the binary form over Q that the
    refusals speak about; the order in which ratpoints finds the points; the values of the doubles
    that bound the search intervals, the search intervals that ratpoints accepts and the points in
    the search region of the caller; and Sturm's theorem as a proposition over Mathlib's Sturm
    sequence and sign variations, which Mathlib does not have. The executable model, on Lean core
    and Std without Mathlib, mirrors the hardware-independent structure of the C code: the checks of
    the input and the refusals, the squarefree test by the remainder chain of the Sturm step, the
    reversal of the polynomial with the map of its points, the points at infinity and the exit at a
    prime modulo which the curve has no points; the doubles of the search intervals as their IEEE
    bits, with a model function for each operation that ratpoints applies to them, the exact bounds
    of the numerators, the range of the denominators and the Sturm step, which narrows the search
    intervals by bisection to those where the polynomial may be >= 0; the choice of the moduli and
    of the cut points of the three stages of the sieve by the cost model of the C code, in Lean
    core's Float with the log and pow of the C library of the platform; the tables of the primes, of
    the prime powers and of the products of them, computed as the C code computes them, and their
    rows, built by the builders of ratpoints and kept in its tables of rows; the 2-adic information
    with the classes of the denominators modulo 64, the divisors of the leading coefficient for odd
    degree, the forbidden divisors and the Jacobi test, and the loop over the denominators in its
    four shapes and its order, in blocks, with the correction of the moduli between them; the sieve
    of a denominator on bit arrays of 64-bit words in three stages, the first in chunks of 16 bit
    arrays as the default build compiles it, with the numerators packed by the stride of their
    class, the reductions by a multiplication with the reciprocal of the modulus, the extraction of
    the set bits, the test for common factors on 64-bit longs and the exact check; the delivery of
    the points to the callback of the caller with its stops, the options RATPOINTS_NO_CHECK and
    RATPOINTS_NO_Y and the flags written back; the report of the library under RATPOINTS_VERBOSE;
    and the command-line program ratpoints-lean, which reads its command line and prints the points
    and the report as the program of ratpoints does. The compile-time constants of the C code are
    definitions of the model, and no proof depends on their values beyond a few facts checked by
    decide. The contracts of the components are proved with the program logic of Lean core. The main
    theorems say that, for every value of the options of the sieve, whatever moduli the search
    chooses, findPoints refuses exactly the inputs that ratpoints refuses and otherwise returns,
    with the exact check on, exactly the points of height at most H in the search region (assuming
    Sturm's theorem when the Sturm step is on), without duplicates, in the order of ratpoints; with
    the statements under RATPOINTS_NO_CHECK, the protocol of the delivery and the two theorems of
    the brute-force reference they are the eleven statements of comparator/challenges.json, which
    lake comparator --paranoid accepted on 2026-10-27. Proved but not certified: what ratpoints-lean
    prints, that the Sturm step keeps every point under Sturm's theorem, and that the blocks of the
    run, sifted apart and delivered in their order, as the threads of ratpoints deliver them, give
    what the run delivers. Every line of code of the C files is recorded, with the declarations that
    model it or the reason for its exclusion, and CI checks the record against the C code at the
    pinned commit; the differential tests compare ratpoints-lean with the C program, built on the
    same machine (5397 comparisons in the default suites, 13 in the suite of the runs of test4.sh
    above height 30000 and 92 in the suite of the searches in which ratpoints corrects its moduli,
    none failed).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Ratpoints.mem_bruteForce_iff"
      file: "Ratpoints/Proof/BruteForce.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/challenges.json"
