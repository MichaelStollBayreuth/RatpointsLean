# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# See https://github.com/mathlib-initiative/formalization.yaml

version: "v0.4"

# project - the formalization itself (not the source).
project:
  name: "RatpointsLean: a verified model of ratpoints"
  description: >
    A Lean 4 model of ratpoints, the C program that finds the rational points of bounded height on
    the curves y^2 = F(x, z), F a binary form of even degree with integer coefficients, by sieving.
    The model mirrors the hardware-independent structure of the C code function by function (the
    same loops, tables, bit arrays of 64-bit words and index arithmetic); the proofs are to show
    that, for every well-formed choice of the sieving parameters, it returns exactly the normalized
    points of height at most H, without duplicates, and refuses, for heights below 2^63, exactly
    the inputs that the C program refuses in a default run (fewer than two or more than
    maxDegree + 1 = 101 coefficients, H = 0, a binary form that is not squarefree); a
    correspondence record and differential tests link the model to the C code.
  authors: ["Michael Stoll"]
  responsible_maintainers: ["Michael Stoll"]
  license: "Apache-2.0"

# sources - what was formalized.
sources:
  - title: "ratpoints: a program to find rational points on hyperelliptic curves, release 3.1.1"
    authors: ["Michael Stoll"]
    id: "https://github.com/MichaelStollBayreuth/ratpoints, tag v3.1.1 (commit 1a998538dfa835bb1bce6047e75302cc01517443)"
    type: "software"
    location: >
      the library (find_points.c, sift.c, init.c, sturm.c, rp-private.h, ratpoints.h, primes.h,
      and the generators gen_find_points_h.c and gen_init_sieve_h.c) and the parts of main.c that
      the command-line program mirrors
    relationship: "formalizes"
    note: >
      The C code is modelled, not translated (Lean has no semantics of C): every model
      declaration names the lines of C it models, at the pinned commit, and
      scripts/correspondence.py checks the record (correspondence/README.md).
    license: "GPL-2.0-or-later"
    author_endorsement: "participated"
  - title: "ratpoints-3.1 (the manual of the program)"
    authors: ["Michael Stoll"]
    id: "ratpoints-doc-3.1.tex in the repository above, at the same commit"
    type: "manual"
    location: "the description of the library function find_points and of the command line"
    relationship: "formalizes"
    note: "The specification of the Lean development is the behaviour the manual and the code define."
    license: "GPL-2.0-or-later"
    author_endorsement: "participated"

related_formalizations: []

classification:
  arxiv: ["math.NT", "cs.LO"]
  msc2020: ["11G30", "14G05", "11Y50", "68V20"]

# project status
status:
  scope: >
    Stages A, B, C1 and C2. Stage A set up the Lake project with the libraries of the model (Lean
    core and Std only), the specification and the proofs, the CI, the blueprint, the correspondence
    record with its checking script, and the comparator harness, and settled the specification in
    the blueprint. Stage B: the specification in Lean (the binary form, the normalized points of
    height at most H, the finite set of them, and the binary form over Q that the refusals speak
    about), the brute-force reference in the model with the theorems that it lists exactly these
    points, each once, certified by comparator, the command-line program ratpoints-lean, which reads
    its command line as the C program does, with its checks, messages and exit statuses, and the
    differential tests that compare it with the C program (the test suites of ratpoints,
    hand-written and random command lines). Stage C1: the plain sieve in the skeleton of the C code
    (the compile-time constants of the C code as definitions, the sieving parameters with their
    well-formedness, the tables of a prime and their rows, the sieve of one denominator, its
    survivors, the denominators, the points at infinity), the contracts of its loops proved with the
    program logic of Lean core, and the theorem that for every well-formed choice of the parameters
    it returns the list of the brute-force reference; the main theorems (the membership and
    no-duplicates theorems for findPoints, its refusals in the form of stage C1, and the
    well-formedness of the parameters that the options of the program give) are certified by
    comparator; ratpoints-lean runs the sieve with the parameters of its options, and the
    differential tests have a suite of parameters. Stage C2: the sieve on the bit arrays of 64-bit
    words of the C code (the width of the bit arrays as a constant of the build and the array size
    of the pieces as a parameter, the operations on bit arrays and the lowest set bit as in the C
    code, the rows of a denominator as words, each made when first needed, the first stage over a
    piece, the check of a numerator, the walk through the set bits of a word, the scan up to a
    sentinel, one piece with the masks at its ends, one denominator in pieces, and the run), with
    the contracts of its loops proved with the program logic of Lean core for every width of the
    bit arrays, and the plain sieve of stage C1 kept as its reference; findPoints and
    ratpoints-lean run it, and the main theorems keep their statements; the differential tests
    search up to height 30000, and the runs of test4.sh up to height 100000 form a suite run
    locally. Next: stage D, the set-up of the search; the introduction of the blueprint lists the
    later stages (the set-up, the denominator and numerator sides, the order and protocol, the
    search region and the Sturm step).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Ratpoints.mem_bruteForce_iff"
      file: "Ratpoints/Proof/BruteForce.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/challenges.json"
    - declaration: "Ratpoints.nodup_bruteForce"
      file: "Ratpoints/Proof/BruteForce.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/challenges.json"
    - declaration: "Ratpoints.mem_iff_isPoint_of_findPoints_eq_ok"
      file: "Ratpoints/Proof/FindPoints.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/challenges.json"
    - declaration: "Ratpoints.nodup_of_findPoints_eq_ok"
      file: "Ratpoints/Proof/FindPoints.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/challenges.json"
    - declaration: "Ratpoints.exists_findPoints_eq_error_iff"
      file: "Ratpoints/Proof/FindPoints.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/challenges.json"
    - declaration: "Ratpoints.wf_sieveParams"
      file: "Ratpoints/Proof/Params.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/challenges.json"

# how it was produced.
automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >
        Interactive agent sessions directed by the author, with the conventions of the author's
        Lean projects (Mathlib's style and naming, short proofs) enforced: a per-commit
        verification chain (a build without warnings with Mathlib's standard linters, a project
        style lint, a layout check of the imports and of the restrictions on the model, the
        correspondence check against the C code at the pinned commit, the blueprint's
        declaration check, and a diff of the types of all declarations), with sub-agents for
        research and review.
      cost:
        wall_time: ""
        spend_usd: "subscription-based usage"
        hardware: "API-only"
      prompting_notes: >
        The design was fixed by the author on 2026-10-08, after two rounds of independent review,
        on the basis of an analysis of the whole C library (its components one by one, the
        specification, the history of the bugs, a survey of the Lean tooling, prototypes). Each
        stage begins with a blueprint chapter (components, contracts, proposed names) that the
        author reviews before any Lean code of the stage is written.
  spend_usd: "subscription-based usage (no metered API spend)"
  notes: >
    The C defects found while this project was planned were fixed first, in ratpoints 3.1.1, so
    that the specification describes the fixed behaviour.

# fidelity
fidelity:
  divergences: >
    By design: a C long is an Int, with the obligation that its value lies in the range of the C
    type; a pointer is an index; the SIMD operations are the word operations they implement; the
    threads are replaced by the sequential order of the blocks; the heuristics that choose the
    sieving parameters are not modelled, since the theorems quantify over every well-formed
    choice; the search intervals have exact rational ends. Where the library function
    find_points and the command-line program differ (the order of the checks on the input), the
    model follows the program. Each deviation is recorded with its component in the
    correspondence record.

# review status
review:
  status: "unchecked"
  reviewers: []
  notes: >
    No review by others yet; the main theorems are certified by comparator (status.main_results).
    Each stage chapter of the blueprint is reviewed by the author before its Lean code is
    written.

# alignment - how source statements map to formal declarations.
alignment:
  namespace: "Ratpoints"
  statements:
    - source: "the points the program prints: the normalized solutions of y^2 = F(x, z) of height at most H"
      lean: "Ratpoints.IsPoint"
      module: "Ratpoints.Spec.Basic"
      status: "formalized"
      note: >
        the specification (Ratpoints.binaryForm, Ratpoints.IsPoint, Ratpoints.points); the
        brute-force reference Ratpoints.bruteForce lists exactly these points, each once
        (Ratpoints.mem_bruteForce_iff, Ratpoints.nodup_bruteForce), certified by comparator
    - source: "find_points returns each such point exactly once"
      lean: "Ratpoints.mem_iff_isPoint_of_findPoints_eq_ok"
      module: "Ratpoints.Proof.FindPoints"
      status: "partially-formalized"
      note: >
        for the sieve on the bit arrays of words of stage C2 and every well-formed choice of the
        sieving parameters, the array size of the pieces included
        (Ratpoints.mem_iff_isPoint_of_findPoints_eq_ok, Ratpoints.nodup_of_findPoints_eq_ok),
        certified by comparator; the later stages bring Ratpoints.findPoints closer to the C code,
        and the theorems move with it
    - source: "the refusals: fewer than two or more than maxDegree + 1 = 101 coefficients, H = 0, a binary form that is not squarefree"
      lean: "Ratpoints.exists_findPoints_eq_error_iff"
      module: "Ratpoints.Proof.FindPoints"
      status: "partially-formalized"
      note: >
        the refusal theorem in its form of stage C1 (fewer than two or more than maxDegree + 1
        coefficients, H = 0), certified by comparator; stage D adds the binary form that is not
        squarefree
    - source: "the order of the output"
      lean: ""
      module: ""
      status: "not-formalized"
      note: "stage G"
    - source: "the Sturm step covers every real point where F >= 0"
      lean: ""
      module: ""
      status: "not-formalized"
      note: "stage H; Sturm's theorem is a hypothesis until Mathlib has it"

acknowledgements: ""
