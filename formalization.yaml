# how it was produced.
automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >
        Interactive agent sessions directed by the author, with the conventions of the author's Lean
        projects (Mathlib's style and naming, short proofs) enforced: a per-commit verification
        chain (a build without warnings with Mathlib's standard linters, a project style lint, a
        layout check of the imports and of the restrictions on the model, the correspondence check
        against the C code at the pinned commit, the blueprint's declaration check, and a diff of
        the types of all declarations), with sub-agents for research, for drafts of the Lean code
        (written in a separate copy and transplanted into the repository after review, through the
        verification chain), and for the review of the C ranges and of the code; the project is also
        built with other values of the compile-time constants of the C code, to check that no proof
        depends on them. The statements of comparator/challenges.json are certified with Lake's lake
        comparator --paranoid (Lean v4.35.0 and later), which builds and exports the project in a
        sandbox and checks the export with Lean's kernel and the five external checkers bundled with
        Lean.
      cost:
        wall_time: ""
        spend_usd: "subscription-based usage"
        hardware: "API-only"
      prompting_notes: >
        The design was fixed by the author after two rounds of independent review, on the basis of
        an analysis of the whole C library (its components one by one, the specification, the
        history of the bugs, a survey of the Lean tooling, prototypes). Each part of the model was
        planned in a blueprint chapter (components, contracts, proposed names), drafted from
        research and a prototype in a separate copy and reviewed by the author, and its code was
        pushed only after his review. A review of the whole development at the end simplified the
        proofs, and the blueprint describes the result.
  spend_usd: "subscription-based usage (no metered API spend)"
  notes: >
    The model is that of ratpoints 3.1.1, which fixes the defects of the C code that the analysis
    for this project found, so that the specification describes the fixed behaviour.

# fidelity
fidelity:
  divergences: >
    By design: a C long is an Int or a Nat, with the obligation that its value lies in the range of
    the C type, or, in the test for common factors and in the bits of an interval of numerators, a
    64-bit word, as in the C code; the reductions by a reciprocal compute on 64-bit words, with the
    high half of the 128-bit product, for which Lean core has no type, from the 32-bit halves; a
    pointer is an index; the SIMD operations are the word operations they implement, and the arm of
    the first stage that the build compiles is chosen by a test on the constant of the chunk; the
    threads are replaced by the sequential order of the blocks, which gives the same output; the
    heuristics that choose the sieving parameters by the curve are modelled and run in the search,
    as in ratpoints, and the theorems hold for every value of the options of the sieve, whatever
    moduli the search chooses; the doubles of these heuristics are Lean core's Float, whose
    arithmetic and log and pow are those of the platform, as in ratpoints, so that the choice, and
    what depends on it (the survivors under RATPOINTS_NO_CHECK, the numbers of the moduli used and
    the report under RATPOINTS_VERBOSE), agrees with that of ratpoints on the same machine, and no
    proof reads their values; the doubles of the search intervals are their IEEE bits, with a model
    function for each operation on them, and the specification reads their values as extended
    rationals; the callback is a Lean function that takes the coordinates and the caller's data and
    returns its value, whether it stops the search, and the new data, for the C function with the
    pointers info and quit; and the theorems that read the points with the Sturm step on assume
    Sturm's theorem, which Mathlib does not have (Ratpoints.SturmTheorem, a hypothesis, not an
    axiom). Where the library function find_points and the command-line program differ (the order of
    the checks on the input), the model follows the program. Each deviation is recorded with its
    component in the correspondence record.

# review status
review:
  status: "unchecked"
  reviewers: []
  notes: >
    No review by others; the main theorems are certified by comparator (status.main_results). The
    author reviewed the plan of each part of the model, a blueprint chapter, before its code was
    pushed.

# alignment - how source statements map to formal declarations.
alignment:
  namespace: "Ratpoints"
  statements:
    - source: "the points the program prints: the normalized solutions of y^2 = F(x, z) of height at most H"
      lean: "Ratpoints.IsPoint"
      module: "Ratpoints.Spec.Basic"
      status: "formalized"
      note: >
        the specification (Ratpoints.binaryForm, Ratpoints.IsNormalizedPair, Ratpoints.IsPoint,
        Ratpoints.points); the brute-force reference Ratpoints.bruteForce lists exactly these
        points, each once (Ratpoints.mem_bruteForce_iff, Ratpoints.nodup_bruteForce), certified by
        comparator
    - source: "find_points returns each such point exactly once"
      lean: "Ratpoints.mem_iff_isPoint_of_findPoints_eq_ok"
      module: "Ratpoints.Proof.Output"
      status: "partially-formalized"
      note: >
        for every value of the options of the sieve, whatever moduli the search chooses, and every
        value of the options of the search: with RATPOINTS_NO_CHECK clear, the list holds exactly
        the points in the search region of the options, those with y >= 0 under RATPOINTS_NO_Y,
        assuming Sturm's theorem when the Sturm step is on
        (Ratpoints.mem_iff_isPoint_of_findPoints_eq_ok), and for every option it has no duplicates
        (Ratpoints.nodup_of_findPoints_eq_ok), both certified by comparator; the proofs go through
        the reference of the polynomial searched (Ratpoints.exists_eq_of_findPoints_eq_ok) and the
        permutation of the brute-force reference filtered by RATPOINTS_NO_Y and the search region
        (Ratpoints.perm_filter_bruteForce_of_findPoints_eq_ok); the threads, which the model leaves
        out, sift the blocks apart and deliver them in their order, which gives what the run
        delivers (Ratpoints.Sieve.run_deliverSlots_eq_fst_run_sieveRun, not certified by comparator)
    - source: "the refusals: fewer than two or more than maxDegree + 1 = 101 coefficients, H = 0 or H >= 2^63, a binary form that is not squarefree, search intervals that are not well formed"
      lean: "Ratpoints.exists_findPoints_eq_error_iff_of_sturm_nonneg"
      module: "Ratpoints.Proof.Output"
      status: "formalized"
      note: >
        for every value of the options of the sieve, with the Sturm step on, as in a run without
        options (Ratpoints.exists_findPoints_eq_error_iff_of_sturm_nonneg), and without it, the
        refusals of the C program under -s (Ratpoints.exists_findPoints_eq_error_iff_of_sturm_neg),
        both with the search intervals that are not well formed among the refusals, and both
        certified by comparator
    - source: "the order of the output"
      lean: "Ratpoints.eq_orderedPoints_of_findPoints_eq_ok"
      module: "Ratpoints.Proof.Output"
      status: "partially-formalized"
      note: >
        with RATPOINTS_NO_CHECK clear, the list of Ratpoints.findPoints is Ratpoints.orderedPoints
        (Ratpoints.Spec.Order: the points at infinity of the polynomial searched, then its
        denominators in the order of the loop of the search, ascending but for the divisors of the
        leading coefficient in the order of binary counting over its primes, the numerators
        ascending and +y before -y, mapped back after a reversal, up to the largest denominator of
        the search), filtered by RATPOINTS_NO_Y and the search region of the options, assuming
        Sturm's theorem when the Sturm step is on, certified by comparator, and the differential
        tests compare it with the order of the C program on every point list
    - source: "the callback protocol of find_points: process, info, quit and the count"
      lean: "Ratpoints.map_findPointsWith_eq_map_findPoints"
      module: "Ratpoints.Proof.Output"
      status: "formalized"
      note: >
        for every value of the options of the sieve and every option, Ratpoints.findPointsWith with
        any callback and its data gives the data and the count of Ratpoints.Delivery.deliver, the
        calls of the callback for the points of the list of Ratpoints.findPoints in their order up
        to and including the first that stops the search, and refuses exactly what
        Ratpoints.findPoints refuses, with the same errors; certified by comparator
    - source: "RATPOINTS_NO_CHECK: the survivors of the sieve, delivered with y = 0"
      lean: "Ratpoints.isNormalizedPair_of_mem_of_findPoints_eq_ok_of_noCheck"
      module: "Ratpoints.Proof.Output"
      status: "formalized"
      note: >
        under RATPOINTS_NO_CHECK every element (x, y, z) of the list has y = 0 and a normalized pair
        (x, z) of height at most H (Ratpoints.IsNormalizedPair) and lies in the search region
        (Ratpoints.isNormalizedPair_of_mem_of_findPoints_eq_ok_of_noCheck), every point (x, y, z)
        gives the element (x, 0, z) (Ratpoints.mem_of_isPoint_of_findPoints_eq_ok_of_noCheck), and
        the list of the search with the exact check and RATPOINTS_NO_Y, with y replaced by 0, is a
        sublist of it (Ratpoints.map_sublist_of_findPoints_eq_ok_of_noCheck); all three certified by
        comparator
    - source: "what the command-line program prints"
      lean: "Ratpoints.Cli.run_eq_of_findPointsWith_eq_ok"
      module: "Ratpoints.Proof.Cli"
      status: "formalized"
      note: >
        without -v, which -q cancels (Ratpoints.Cli.verbose_eq_false_of_input_eq_ok), and whose
        report of the library between the points is tested, not proved: the head of the report, the
        string before the points, the points that the callback of the program counts (all but those
        at infinity under -i and the affine ones outside the search intervals of the command line,
        and of these only the first under -1) in the format, joined by the string between them, none
        under -z, the string after them and the end of the report with their number as its count
        (Ratpoints.Cli.total_eq_of_findPointsWith_eq_ok); under -q only the strings and the points
        (Ratpoints.Cli.run_eq_of_findPoints_eq_ok); not certified by comparator
    - source: "the points that the program prints with -l -u -dl -du: those of the search region of its command line"
      lean: "Ratpoints.Cli.mem_filter_keeps_iff_of_input_eq_ok"
      module: "Ratpoints.Proof.Cli"
      status: "formalized"
      note: >
        assuming Sturm's theorem when the Sturm step is on, without -x, the points of the list of
        Ratpoints.findPoints on the joined intervals of a command line that the callback of the
        program keeps are exactly the points of height at most H in the exact search region of the
        command line (the ends as the numbers they are, not their doubles), those with y >= 0 under
        -y, and the points at infinity unless -i; not certified by comparator
    - source: "the Sturm step covers every real point where F >= 0"
      lean: "Ratpoints.Sturm.covers_computeSturm"
      module: "Ratpoints.Proof.SturmCoverage"
      status: "partially-formalized"
      note: >
        assuming Sturm's theorem (Ratpoints.SturmTheorem, a hypothesis, not an axiom), the intervals
        that the Sturm step leaves at a depth of at most 55, for a polynomial of degree 1 <= d <
        2^57, hold every rational x with |x| <= 2^63 and F(x) >= 0 in the caller's intervals
        (Ratpoints.Sturm.covers_computeSturm), which the search keeps
        (Ratpoints.searchRegion_covers), so that with the exact check on the Sturm step changes only
        the speed (Ratpoints.findPoints_sturm_neg_eq_ok)

acknowledgements: ""
